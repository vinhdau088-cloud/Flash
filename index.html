<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK Flashcard Pro</title>
  <style>
    :root {
      --bg: #eef5f3;
      --card-bg: #f8fafc;
      --primary: #4f46e5;
      --text: #1e293b;
      --border: #e2e8f0;
      --remember: #ef4444;
      --forget: #3b82f6;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title h1 { margin: 0; font-size: 24px; color: #1e3a8a; }
    .title p { margin: 4px 0 0; color: #64748b; font-size: 13px; }
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
    
    /* Flip Card Setup */
    .card-wrapper {
      perspective: 1000px;
      margin: 20px 0;
    }
    .card {
      background: var(--card-bg);
      border: 2px solid #e0f2fe;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
      min-height: 220px;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      backface-visibility: hidden;
      width: 100%;
    }
    .card-back {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      box-sizing: border-box;
      padding: 25px;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .hanzi { font-size: 64px; font-weight: bold; margin: 0; color: #0f172a; }
    .pinyin { color: #2563eb; font-size: 20px; font-weight: 600; margin: 5px 0; }
    .hint { color: #64748b; font-size: 13px; margin-top: 15px; }
    
    .grid-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .info-box {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
    }
    .info-box span { display: block; color: #64748b; font-weight: 600; margin-bottom: 4px; text-transform: uppercase;}
    .info-box strong { font-size: 14px; color: #0f172a; }

    .example-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      text-align: left;
      margin-bottom: 20px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 12px 5px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover { background: #f1f5f9; }
    .btn-remember { color: var(--remember); }
    .btn-forget { color: var(--forget); }
    
    .mode-switch {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">
      <h1>HSK FLASH CARD</h1>
      <p>Học chữ Hán • Nhớ lâu • Ôn tập thông minh</p>
    </div>
    <span id="card-counter" style="font-weight:bold; color:#64748b;">1/1</span>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="card-wrapper" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-front">
        <h2 class="hanzi" id="front-hanzi">谢谢</h2>
        <div class="pinyin" id="front-pinyin">[xièxie]</div>
        <div class="hint">Hãy đoán nghĩa trước khi lật thẻ</div>
      </div>
      <div class="card-back">
        <h3 id="back-meaning" style="font-size: 24px; color: #2563eb; margin:0 0 10px 0;">Cảm ơn</h3>
        <p id="back-detail" style="color: #475569; margin:0;"></p>
      </div>
    </div>
  </div>

  <div class="grid-info">
    <div class="info-box"><span>Bộ / Thành phần</span><strong id="info-radical">-</strong></div>
    <div class="info-box"><span>Số nét</span><strong id="info-strokes">-</strong></div>
    <div class="info-box"><span>Hán Việt</span><strong id="info-hanviet">-</strong></div>
    <div class="info-box"><span>Từ loại</span><strong id="info-pos">-</strong></div>
  </div>

  <div class="example-box">
    <strong>📖 CÂU VÍ DỤ</strong><br>
    <span id="ex-cn" style="font-weight:600;">-</span><br>
    <small id="ex-pinyin" style="color:#64748b;">-</small> | <span id="ex-vi">-</span>
  </div>

  <div class="actions">
    <button class="btn-remember" onclick="markWord('remember')">❤️ ĐÃ NHỚ</button>
    <button onclick="nextCard()">➔ TIẾP</button>
    <button class="btn-forget" onclick="markWord('forget')">☹ CHƯA NHỚ</button>
    <button onclick="flipCard()">🔄 XEM ĐÁP ÁN</button>
  </div>

  <div class="mode-switch">
    <button onclick="filterMode('all')">📚 Tất cả từ vựng</button>
    <button onclick="filterMode('review')">🔄 Ôn tập từ chưa nhớ</button>
  </div>
</div>

<script>
  let allWords = [];
  let currentList = [];
  let currentIndex = 0;

  let remembered = JSON.parse(localStorage.getItem('rememberedWords')) || [];
  let forgotten = JSON.parse(localStorage.getItem('forgottenWords')) || [];

  // Tải dữ liệu từ file words.json
  async function loadWords() {
    try {
      const res = await fetch('words.json');
      allWords = await res.json();
      currentList = [...allWords];
      renderCard();
    } catch (e) {
      console.error("Chưa tìm thấy file words.json, vui lòng tải kèm file json!");
    }
  }

  function renderCard() {
    if (currentList.length === 0) {
      document.getElementById('front-hanzi').innerText = "🎉";
      document.getElementById('front-pinyin').innerText = "Hoàn thành danh sách!";
      return;
    }
    const item = currentList[currentIndex];
    
    // Front
    document.getElementById('front-hanzi').innerText = item.hanzi;
    document.getElementById('front-pinyin').innerText = `[${item.pinyin}]`;
    
    // Back
    document.getElementById('back-meaning').innerText = item.meaning;
    
    // Details
    document.getElementById('info-radical').innerText = item.radical;
    document.getElementById('info-strokes').innerText = item.strokes;
    document.getElementById('info-hanviet').innerText = item.hanviet;
    document.getElementById('info-pos').innerText = item.pos;
    
    // Example
    document.getElementById('ex-cn').innerText = item.example_cn;
    document.getElementById('ex-pinyin').innerText = item.example_pinyin;
    document.getElementById('ex-vi').innerText = item.example_vi;

    // Progress & Counter
    document.getElementById('card-counter').innerText = `${currentIndex + 1}/${currentList.length}`;
    document.getElementById('progress').style.width = `${((currentIndex + 1) / currentList.length) * 100}%`;
    
    // Reset Flip state
    document.getElementById('card').classList.remove('flipped');
  }

  function flipCard() {
    document.getElementById('card').classList.toggle('flipped');
  }

  function nextCard() {
    if (currentIndex < currentList.length - 1) {
      currentIndex++;
      renderCard();
    }
  }

  function markWord(type) {
    const id = currentList[currentIndex].id;
    if (type === 'remember') {
      if (!remembered.includes(id)) remembered.push(id);
      forgotten = forgotten.filter(item => item !== id);
    } else {
      if (!forgotten.includes(id)) forgotten.push(id);
      remembered = remembered.filter(item => item !== id);
    }
    localStorage.setItem('rememberedWords', JSON.stringify(remembered));
    localStorage.setItem('forgottenWords', JSON.stringify(forgotten));
    nextCard();
  }

  function filterMode(mode) {
    currentIndex = 0;
    if (mode === 'review') {
      currentList = allWords.filter(w => forgotten.includes(w.id));
      if(currentList.length === 0) alert("Bạn chưa có từ nào trong danh sách Chưa nhớ!");
    } else {
      currentList = [...allWords];
    }
    renderCard();
  }

  loadWords();
</script>
</body>
</html>
